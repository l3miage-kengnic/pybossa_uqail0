# PyBossa composition for U-QUAIL.
#
#   docker compose --profile local up -d     # workstation (adds Mailpit, fake mail server)
#   docker compose up -d                     # VM (production)
#
# Six services: db (PostgreSQL), redis, web (Flask/gunicorn), worker (RQ),
# scheduler (RQ scheduler), proxy (Caddy, HTTPS). The three PyBossa services
# share the same image and the same configuration (x-pybossa block).
# All ${...} values come from .env (copied from .env.example).

name: uquail

x-pybossa: &pybossa
  image: pybossa:dev
  build:
    context: .
    args:
      PYBOSSA_REF: ${PYBOSSA_REF}
      # repository to clone the server from; defaults to the Bloomberg upstream (see .env.example)
      PYBOSSA_REPO: ${PYBOSSA_REPO:-https://github.com/bloomberg/pybossa.git}
  env_file: .env
  environment:
    # read by the server's alembic/env.py (schema migrations)
    PYB_SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
    POSTGRES_HOST: db
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  volumes:
    - ./deploy/settings_local.py:/config/settings_local.py:ro
    - ./scripts:/scripts:ro
    - uploads:/app/uploads
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  web:
    <<: *pybossa
    command:
      - gunicorn
      - --bind=0.0.0.0:5000
      - --workers=${WEB_WORKERS:-2}
      - --threads=2
      - --timeout=120
      - --forwarded-allow-ips=*
      - --access-logfile=-
      - pybossa.run:app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1g        # 2 gunicorn processes ≈ 600 MB at rest (GRICAD doc §2)

  worker:
    <<: *pybossa
    # RQ queues listened to (names checked in pybossa/core.py and pybossa/jobs.py).
    # Without this service, the application runs but no export or email ever goes through.
    command:
      - python
      - app_context_rqworker.py
      - scheduled_jobs
      - super
      - high
      - medium
      - low
      - email
      - maintenance
    mem_limit: 768m

  scheduler:
    <<: *pybossa
    # Schedules the periodic jobs (statistics, cleanups).
    command: ["python", "run_scheduler.py"]
    mem_limit: 256m

  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"   # plain HTTP, workstation only (see Caddyfile)
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # TLS certificates (keep these)
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

  # Fake mail server, workstation only: emails sent by PyBossa
  # can be read at http://localhost:8025 instead of actually being delivered.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["local"]
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
