# Configuration Alembic (migrations de schéma) pour le conteneur.
# Copie du modèle amont alembic.ini.template, avec UNE différence :
# sqlalchemy.url est laissé vide. alembic/env.py du serveur lit alors
# la variable d'environnement PYB_SQLALCHEMY_DATABASE_URI (fournie par compose.yaml).
# Aucun secret n'est donc écrit dans ce fichier.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
